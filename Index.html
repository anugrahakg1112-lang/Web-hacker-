<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hacker No WA</title>
    <style>
        body {
            background-color: #0d1117;
            color: #00ff41;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background: #161b22;
            padding: 30px;
            border: 2px solid #00ff41;
            border-radius: 8px;
            width: 350px;
            box-shadow: 0 0 15px #00ff41;
            text-align: center;
        }
        h2 { margin-top: 0; text-transform: uppercase; letter-spacing: 2px; }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            background: #0d1117;
            border: 1px solid #00ff41;
            color: #fff;
            font-family: inherit;
            box-sizing: border-box;
        }
        button {
            background: #00ff41;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }
        button:hover { background: #00cc33; }
        #result { margin-top: 15px; font-size: 0.9em; text-align: left; white-space: pre-wrap; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>HACKER NO WA</h2>
    <input type="text" id="nomor" placeholder="Masukkan No HP Korban (+62...)" required>
    
    <select id="pilihan">
        <option value="" disabled selected>Pilih Efek Virus</option>
        <option value="1">1. Jelek Jaringan</option>
        <option value="2">2. HP Error</option>
        <option value="3">3. HP Reset Sendiri</option>
    </select>

    <input type="password" id="password_pelaku" placeholder="Password Pelaku (Jika 1/2)" class="hidden">
    
    <button onclick="kirimVirus()">Kirim Virus</button>
    <div id="result"></div>
</div>

<script>
    document.getElementById('pilihan').addEventListener('change', function() {
        const val = this.value;
        const pwField = document.getElementById('password_pelaku');
        if (val === "1" || val === "2") {
            pwField.classList.remove('hidden');
            pwField.setAttribute('required', 'true');
        } else {
            pwField.classList.add('hidden');
            pwField.removeAttribute('required');
        }
    });

    async function kirimVirus() {
        const nomor = document.getElementById('nomor').value;
        const pilihan = document.getElementById('pilihan').value;
        const password = document.getElementById('password_pelaku').value;
        const resultDiv = document.getElementById('result');

        if (!nomor || !pilihan) {
            resultDiv.innerText = "Error: Isi semua kolom!";
            return;
        }

        resultDiv.innerText = "Menghubungkan ke server...";

        try {
            const response = await fetch('/inject', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nomor, pilihan, password })
            });

            const data = await response.json();

            if (response.ok) {
                resultDiv.innerHTML = `<strong>[SUCCESS]</strong>\n${data.message}\n\nLOG:\n${data.execution_log}\n\nCODE:\n${data.code}`;
            } else {
                resultDiv.innerHTML = `<strong>[FAILED]</strong>\n${data.message}`;
            }
        } catch (error) {
            resultDiv.innerText = "Error koneksi ke server.";
        }
    }
</script>

</body>
</html>
